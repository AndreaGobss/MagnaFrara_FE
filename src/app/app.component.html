<header class="header">
  <div class="container">
    <h1 class="logo">
      <img src="assets/images/MagnaFrara.png" alt="MagnaFrara Logo" class="logo-image">
      MagnaFrara
    </h1>
    
    <!-- Navigazione principale -->
    <nav class="nav">
      <a routerLink="/ristoranti" class="nav-link">Ristoranti</a>
      <a routerLink="/mie-recensioni" class="nav-link" *ngIf="loggedUser">Le mie recensioni</a>
      <a routerLink="/miei-ristoranti" class="nav-link" *ngIf="loggedUser && loggedUser.gestore">I miei ristoranti</a>
      <a routerLink="/account" class="nav-link">Account</a>
    </nav>
    
    <!-- Info utente -->
    <div class="user-info" *ngIf="loggedUser">
      <span class="user-name">Ciao, {{ loggedUser.nome }}!</span>
      <span class="user-type" *ngIf="loggedUser.gestore">(Gestore)</span>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</main>
